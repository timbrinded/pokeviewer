[package]
name = "xtask"
description = "Repository automation for Pokeviewer"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
crc32fast = "=1.5.0"
pokeviewer-core = { version = "=1.0.0", path = "../crates/pokeviewer-core" }
pokeviewer-firmware = { version = "=1.0.0", path = "../crates/pokeviewer-firmware" }
png = "=0.18.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.11.0", default-features = false }
unicode-normalization = "=0.1.25"

[lints]
workspace = true
