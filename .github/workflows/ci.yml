name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    name: Host checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install host Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Install cargo-deny
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-deny@0.20.2

      - name: Install Markdown link checker
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: lychee@0.23.0

      - name: Install actionlint
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          install_dir="$RUNNER_TEMP/actionlint"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" \
            | sha256sum --check
          mkdir -p "$install_dir"
          tar --extract --gzip --file "$archive" --directory "$install_dir"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Check documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked

      - name: Lint Markdown
        run: |
          npx --yes markdownlint-cli2@0.23.0 \
            README.md \
            CONTRIBUTING.md \
            THIRD_PARTY_NOTICES.md \
            'docs/**/*.md' \
            'content/**/*.md' \
            'release/**/*.md'

      - name: Check Markdown links
        run: |
          git ls-files -z '*.md' \
            | xargs -0 lychee \
              --no-progress \
              --max-concurrency 32 \
              --max-retries 6 \
              --retry-wait-time 2

      - name: Check dependency policy
        run: cargo deny --locked check

      - name: Check GitHub Actions
        run: actionlint

  content:
    name: Offline content integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install host Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.96.0

      - name: Rebuild committed content without network
        run: |
          cargo xtask content-build
          git diff --exit-code -- content/generated

  visual:
    name: Visual and recovery goldens
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install host Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.96.0

      - name: Verify visual goldens
        run: |
          cargo xtask golden-check artifacts/visual-diff
          cargo xtask render-recovery-screens artifacts/recovery-screens
          for image in rtc pack panel alarm wake; do
            cmp "artifacts/recovery-screens/$image.png" \
              "docs/evidence/recovery-screens/$image.png"
          done

      - name: Upload visual diff
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-diff
          path: artifacts
          if-no-files-found: warn
          retention-days: 14

  firmware:
    name: ESP32-S3 release
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install host Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.96.0

      - name: Install espup
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: espup@0.17.1

      - name: Install pinned Xtensa Rust
        run: |
          espup install \
            --name esp-1.95.0.0 \
            --targets esp32s3 \
            --toolchain-version 1.95.0.0 \
            --export-file "$RUNNER_TEMP/esp-export.sh"
          source "$RUNNER_TEMP/esp-export.sh"
          echo "$PATH" >> "$GITHUB_PATH"
          echo "LIBCLANG_PATH=$LIBCLANG_PATH" >> "$GITHUB_ENV"
          echo "CLANG_PATH=$CLANG_PATH" >> "$GITHUB_ENV"

      - name: Fix reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct)" >> "$GITHUB_ENV"

      - name: Build release firmware twice and compare loaded sections
        run: |
          firmware=target/xtensa-esp32s3-none-elf/release/pokeviewer-firmware
          cargo xtask firmware-build
          scripts/check-firmware-artifact.sh "$firmware" artifacts/first
          cargo clean -p pokeviewer-firmware --target xtensa-esp32s3-none-elf
          cargo xtask firmware-build
          scripts/check-firmware-artifact.sh "$firmware" artifacts/second
          diff -u \
            artifacts/first/section-hashes.txt \
            artifacts/second/section-hashes.txt
          {
            echo "## ESP32-S3 firmware budgets"
            echo '```text'
            cat artifacts/second/budgets.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build diagnostic firmware
        run: |
          cargo xtask firmware-diagnostic-build
          cargo xtask sleep-diagnostic-build
          cargo xtask timer-sleep-diagnostic-build
          cargo xtask rtc-alarm-assertion-diagnostic-build
          for failure in rtc panel alarm; do
            cargo xtask failure-diagnostic-build "$failure"
          done
          cargo xtask usb-provisioning-build

      - name: Upload firmware
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: esp32s3-release
          path: |
            target/xtensa-esp32s3-none-elf/release/pokeviewer-firmware
            target/xtensa-esp32s3-none-elf/release/pokeviewer-hardware-diagnostic
            target/xtensa-esp32s3-none-elf/release/pokeviewer-sleep-diagnostic
            target/xtensa-esp32s3-none-elf/release/pokeviewer-timer-sleep-diagnostic
            target/xtensa-esp32s3-none-elf/release/pokeviewer-rtc-alarm-assertion-diagnostic
            target/xtensa-esp32s3-none-elf/release/pokeviewer-rtc-failure-diagnostic
            target/xtensa-esp32s3-none-elf/release/pokeviewer-panel-failure-diagnostic
            target/xtensa-esp32s3-none-elf/release/pokeviewer-alarm-failure-diagnostic
            target/xtensa-esp32s3-none-elf/release/pokeviewer-usb-provisioning
          if-no-files-found: error
          retention-days: 14

  release-gate:
    name: Release matrix
    if: always()
    needs:
      - host
      - content
      - visual
      - firmware
    runs-on: ubuntu-latest
    steps:
      - name: Require every job
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            test "$result" = success
          done
