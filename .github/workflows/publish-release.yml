name: Publish release

on:
  workflow_dispatch:

permissions:
  checks: read
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    name: Build, verify, and publish
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install host Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.96.0

      - name: Select the release
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          successful_matrix=$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
            --jq '[.check_runs[] |
              select(.name == "Release matrix" and .conclusion == "success")] |
              length')
          test "$successful_matrix" -gt 0
          package_id=$(cargo pkgid --locked -p pokeviewer-core)
          version=${package_id##*#}
          tag="v$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag"; then
            echo "$tag already exists" >&2
            exit 1
          fi

      - name: Install espup
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: espup@0.17.1

      - name: Install espflash
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: espflash@4.5.0

      - name: Install pinned Xtensa Rust
        run: |
          espup install \
            --name esp-1.95.0.0 \
            --targets esp32s3 \
            --toolchain-version 1.95.0.0 \
            --export-file "$RUNNER_TEMP/esp-export.sh"
          source "$RUNNER_TEMP/esp-export.sh"
          echo "$PATH" >> "$GITHUB_PATH"
          echo "LIBCLANG_PATH=$LIBCLANG_PATH" >> "$GITHUB_ENV"
          echo "CLANG_PATH=$CLANG_PATH" >> "$GITHUB_ENV"

      - name: Build and verify the release
        run: |
          scripts/build-release.sh "$RUNNER_TEMP/release"
          archive="$RUNNER_TEMP/release/pokeviewer-v$VERSION.tar.gz"
          mkdir -p target/release
          tar -xzf "$archive" -C target/release
          test "$(awk -F= '$1 == "source_commit" { print $2 }' \
            "target/release/pokeviewer-v$VERSION/BUILD-METADATA.txt")" \
            = "$GITHUB_SHA"

      - name: Create private draft
        run: |
          bundle="target/release/pokeviewer-v$VERSION"
          archive="$RUNNER_TEMP/release/pokeviewer-v$VERSION.tar.gz"
          gh release create "$TAG" \
            --draft \
            --latest=false \
            --target "$GITHUB_SHA" \
            --title "Pokeviewer v$VERSION" \
            --notes-file "$bundle/RELEASE-NOTES.md" \
            "$archive" \
            "$archive.sha256" \
            "$bundle"/*

      - name: Audit draft downloads
        run: |
          mkdir -p target/draft-audit
          gh release download "$TAG" --dir target/draft-audit
          bundle="target/release/pokeviewer-v$VERSION"
          for source in \
            "$RUNNER_TEMP/release/pokeviewer-v$VERSION.tar.gz" \
            "$RUNNER_TEMP/release/pokeviewer-v$VERSION.tar.gz.sha256" \
            "$bundle"/*; do
            cmp "$source" "target/draft-audit/$(basename "$source")"
          done

      - name: Publish final release
        run: |
          gh release edit "$TAG" --draft=false --latest

      - name: Verify public unauthenticated download
        run: |
          mkdir -p target/public-audit
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          curl --fail --location --silent --show-error \
            "$base/pokeviewer-v$VERSION.tar.gz" \
            --output "target/public-audit/pokeviewer-v$VERSION.tar.gz"
          curl --fail --location --silent --show-error \
            "$base/pokeviewer-v$VERSION.tar.gz.sha256" \
            --output "target/public-audit/pokeviewer-v$VERSION.tar.gz.sha256"
          cmp "$RUNNER_TEMP/release/pokeviewer-v$VERSION.tar.gz" \
            "target/public-audit/pokeviewer-v$VERSION.tar.gz"
          cmp "$RUNNER_TEMP/release/pokeviewer-v$VERSION.tar.gz.sha256" \
            "target/public-audit/pokeviewer-v$VERSION.tar.gz.sha256"
          (
            cd target/public-audit
            sha256sum --check "pokeviewer-v$VERSION.tar.gz.sha256"
          )
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "false"
          test "$(gh release view "$TAG" \
            --json isPrerelease --jq .isPrerelease)" = "false"
          test "$(git ls-remote origin "refs/tags/$TAG" | cut -f1)" \
            = "$GITHUB_SHA"

      - name: Record published release
        run: |
          release_url="https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          {
            echo "Published $release_url"
            echo "Tag commit: $GITHUB_SHA"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Remove failed private draft
        if: failure()
        run: |
          if [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft \
            2>/dev/null)" = "true" ]]; then
            gh release delete "$TAG" --cleanup-tag --yes
          fi
